[ubuntu22]
ubu22-docker ansible_host=127.0.0.1 ansible_port=2222 ansible_user=ubuntu ansible_ssh_private_key_file=_selftest/docker/test_key ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'

[ubuntu24]
ubu24-docker ansible_host=127.0.0.1 ansible_port=2224 ansible_user=ubuntu ansible_ssh_private_key_file=_selftest/docker/test_key ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'

[all:children]
ubuntu22
ubuntu24

[all:vars]
ansible_python_interpreter=/usr/bin/python3
