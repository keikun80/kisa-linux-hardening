# =============================================================================
# KISA 주요정보통신기반시설 기술적 취약점 (Unix: U-01 ~ U-67) 자동 강화/감사
#
# 실행 패턴:
#   # 전수 감사 (dry-run; 시스템엔 아무것도 안 쓰고 변경 "예정"만 나옴)
#   ./audit.sh                       # (감사 리포트 패키지를 쓴다)
#
#   # 단일 ID 만의 실행/감사 (예: U-65 만)
#   ansible-playbook -i inventory/ec2.ini plays/site.yml -t u-65
#   ansible-playbook -i inventory/ec2.ini plays/site.yml -t u-65 --check
#
#   # 카테고리 단위
#   ansible-playbook -i inventory/ec2.ini plays/site.yml -t cat.accounts
#
#   # 배포그룹 선택 (al2023 / fedora / ubuntu) — group_vars 프로ไฟล์ 자동 추종
#   ansible-playbook -i inventory/ec2.ini plays/site.yml -e distro_select=al2023
#   ./scripts/audit.sh 랑으로는 : DISTRO=al2023 ./scripts/audit.sh  (미설정 시 전체)
#
#   # 진짜 적용 (권장 순서: 먼저 --check 로 변화분을 확인)
#   ansible-playbook -i inventory/ec2.ini plays/site.yml --diff
#
# 태그 체계 : u-01 … u-67 (ID), cat.accounts/cat.files/cat.services/cat.lifecycle
# =============================================================================
- name: KISA 주요기반시설 Linux 취약점 강화 및 감사 (U-01 ~ U-67)
  hosts: "{{ distro_select | default('al2023') }}"   # al2023 / fedora / ubuntu / all(미설정 기본)
  serial: 1                # 일괄 확산 사고 방지. 안정 확인 후 serial: 3 등 완화
  become: true             # 강제 작업은 root 로 수행
  become_method: sudo
  gather_facts: true
  roles:
    - kisa_linux_harden
