# ===========================================================================
# Amazon Linux 2023 특화 프로파일 (dnf/rpm 계열, wheel 그룹 보유)
# ===========================================================================
vu_pam_strict_stack: true          # RHEL 계열은 authselect 시대지만 pam faillock 직접 주입이 안정적
                                   # -> U-02/U-03 PAM 조치를 기본적으로 자동 적용
vu_su_wheel_group: wheel           # U-06: /etc/pam.d/su 의 pam_wheel.group, su 바이너리는 root:wheel 4750
vu_wheel_users:                    # U-06/U-08: wheel 그룹에 진입하여 sudo/su 사용 가능하도록 할 계정
  - ec2-user

vu_chrony_unit: chronyd            # U-65
vu_legacysvc_pkgmap:               # U-34/36/44/52: vu_legacy_service_cleanup=true 일 때 제거 후보
  finger: []                        # 기본 미설치 (빈 리스트 — 값 추가 시 목록으로 사용)
  rservices: [rsh-server, rsh-client, rlogin]
  tftp: [tftp-server]
  talk: []
  telnet: [telnet]
vu_snmp_pkgs: [net-snmp]           # U-58
vu_nfs_server_pkgs: [nfs-utils]    # U-39
vu_autofs_pkgs: [autofs]           # U-41
vu_nis_pkgs: [nis]                 # U-43
vu_ftp_server_pkgs: [vsftpd]       # U-54
vu_dns_server_pkgs: [bind]          # U-49 탐지용

vu_autopatch:
  pkg: dnf-automatic               # U-64: 주간 보안 자가 패칭
  timer_unit: dnf-automatic.timer
