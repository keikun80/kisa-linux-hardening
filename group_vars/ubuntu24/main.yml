# ===========================================================================
# Ubuntu 24.04 LTS (Noble Numbat) 특화 프로파일 (dpkg/apt 계열)
# ===========================================================================
# 기본 PAM 스택 설정: 사전 백업 후 안전 적용
vu_pam_strict_stack: true

# wheel 대체: Ubuntu는 sudo 그룹을 관리자 그룹으로 사용
vu_su_wheel_group: sudo            # U-06
vu_wheel_users:                    # U-06/U-08: sudo 그룹에 진입할 계정
  - ubuntu

# SSH 서비스 관리 (Ubuntu 24.04: ssh.socket 소켓 활성화 방식이 기본)
vu_sshd_service_name: ssh
vu_sshd_use_socket: true

# 시간 동기화 (U-65)
vu_chrony_unit: chrony

# 로깅 (U-66: Ubuntu 24.04는 rsyslog 미설치 기본, systemd-journald 중심)
vu_logging_service: journald

# 레거시 취약 서비스 및 패키지 맵
vu_legacysvc_pkgmap:
  finger: []
  rservices: []                    # modern Ubuntu 는 r-services 패키지가 사실상 사라짐
  tftp: [tftpd-hpa]
  talk: []
  telnet: [telnetd]                # 패키지가 존재하는 경우에 한정
vu_snmp_pkgs: [snmpd]              # U-58
vu_nfs_server_pkgs: [nfs-kernel-server]  # U-39
vu_autofs_pkgs: [autofs]           # U-41
vu_nis_pkgs: [nslcd, nscd, ypbind] # U-43
vu_ftp_server_pkgs: [vsftpd]       # U-54
vu_dns_server_pkgs: [bind9]         # U-49 탐지용

# 무인 자동 보안 패치 (U-64)
vu_autopatch:
  pkg: unattended-upgrades
  timer_unit: apt-daily-upgrade.timer

# U-23: Ubuntu 필수 및 신뢰 SUID/SGID 바이너리 목록
vu_trusted_suid_bins:
  - sudo
  - su
  - mount
  - umount
  - passwd
  - gpasswd
  - newgrp
  - chage

