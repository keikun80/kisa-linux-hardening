# =============================================================================
# 대상 AWS EC2 인벤토리 예시
# 사용법: cp inventory/ec2.example.ini inventory/ec2.ini  후 실제 값으로 교체
#
# 대량 인스턴스 환경이면 정적 인벤토리 대신 ansible.aws 컬렉션의 동적 인벤토리
# (인스턴스 태그 예: kisa_scope=yes 조건 수집) 사용을 권장한다.
# =============================================================================

# ---------- Amazon Linux 2023 ----------
[al2023]
localhost ansible_connection=local
alm-web-01.example.internal ansible_host=10.0.1.11
alm-web-02.example.internal ansible_host=10.0.1.12
[al2023:vars]
ansible_user=ec2-user

# ---------- Fedora ----------
# 주의: 공식 Fedora AMI의 로그인 사용자명은 버전에 따라 달라질 수 있다.
[fedora]
fed-db-01.example.internal ansible_host=10.0.2.11
[fedora:vars]
ansible_user=fedora

# ---------- Rocky Linux 8 ----------
[rocky8]
rk8-web-01.example.internal ansible_host=10.0.4.8
[rocky8:vars]
ansible_user=rocky

# ---------- Rocky Linux 9 ----------
[rocky9]
rk9-web-01.example.internal ansible_host=10.0.4.9
[rocky9:vars]
ansible_user=rocky

# ---------- Rocky Linux 10 ----------
[rocky10]
rk10-web-01.example.internal ansible_host=10.0.4.10
[rocky10:vars]
ansible_user=rocky

# ---------- Ubuntu 22.04 LTS ----------
[ubuntu22]
ubu22-app-01.example.internal ansible_host=10.0.3.22
ubu22-app-02.example.internal ansible_host=10.0.3.23
[ubuntu22:vars]
ansible_user=ubuntu

# ---------- Ubuntu 24.04 LTS ----------
[ubuntu24]
ubu24-app-01.example.internal ansible_host=10.0.3.24
ubu24-app-02.example.internal ansible_host=10.0.3.25
[ubuntu24:vars]
ansible_user=ubuntu

# ---------- 공통 ----------
[all:children]
al2023
fedora
rocky8
rocky9
rocky10
ubuntu22
ubuntu24
[all:vars]
ansible_python_interpreter=auto_silent
# SSH 키 인증 경로가 다르면 다음 라인 주석을 해제하고 지정한다:
# ansible_private_key_file=~/.ssh/ec2_deploy.pem
