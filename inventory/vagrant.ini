# =============================================================================
# Vagrant 로컬 가상머신 테스트 인벤토리
# =============================================================================
# 사용 방법:
#   1. vagrant up
#   2. bash scripts/vagrant_test.sh (또는 아래 명령 직접 실행)
#      ansible-playbook -i inventory/vagrant.ini plays/site.yml -e distro_select=ubuntu22 --check
# =============================================================================

# ---------- Ubuntu 22.04 LTS ----------
[ubuntu22]
kisa-ubuntu22 ansible_host=192.168.56.22

[ubuntu22:vars]
ansible_user=ubuntu
# Private Network 대신 포트 포워딩(2222) 사용 시 주석 해제:
# ansible_host=127.0.0.1
# ansible_port=2222

# ---------- Ubuntu 24.04 LTS ----------
[ubuntu24]
kisa-ubuntu24 ansible_host=192.168.56.24

[ubuntu24:vars]
ansible_user=ubuntu
# Private Network 대신 포트 포워딩(2224) 사용 시 주석 해제:
# ansible_host=127.0.0.1
# ansible_port=2224

# ---------- 공통 ----------
[all:children]
ubuntu22
ubuntu24

[all:vars]
ansible_python_interpreter=/usr/bin/python3
# Vagrant 기본 비공개 키 (환경에 따라 자동 탐색 또는 지정)
ansible_ssh_private_key_file=~/.vagrant.d/insecure_private_key
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o IdentitiesOnly=yes'
