# =============================================================================
# Vagrant 로컬 가상머신 테스트 인벤토리
# =============================================================================
# 사용 방법:
#   1. vagrant up
#   2. bash scripts/vagrant_test.sh (또는 아래 명령 직접 실행)
#      ansible-playbook -i inventory/vagrant.ini plays/site.yml -e distro_select=ubuntu22 --check
# =============================================================================

# ---------- Amazon Linux 2023 ----------
[al2023]
kisa-al2023 ansible_host=127.0.0.1 ansible_port=2223

[al2023:vars]
ansible_user=ec2-user

# ---------- Ubuntu 22.04 LTS ----------
[ubuntu22]
kisa-ubuntu22 ansible_host=127.0.0.1 ansible_port=2222

[ubuntu22:vars]
ansible_user=ubuntu

# ---------- Ubuntu 24.04 LTS ----------
[ubuntu24]
kisa-ubuntu24 ansible_host=127.0.0.1 ansible_port=2224

[ubuntu24:vars]
ansible_user=ubuntu

# ---------- 공통 ----------
[all:children]
al2023
ubuntu22
ubuntu24

[all:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_private_key_file=~/.vagrant.d/insecure_private_keys/vagrant.key.ed25519
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o IdentitiesOnly=yes -o PubkeyAcceptedKeyTypes=+ssh-rsa'
