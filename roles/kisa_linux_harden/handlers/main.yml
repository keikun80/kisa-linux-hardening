---
- name: "reload sshd (sshd_config 반영)"
  block:
    - name: "systemd reload ssh/sshd service"
      systemd:
        name: "{{ vu_sshd_service_name | default('sshd') }}"
        state: reloaded
  rescue:
    - name: "fallback reload or restart ssh (socket activation 대응)"
      command: "systemctl try-reload-or-restart {{ vu_sshd_service_name | default('sshd') }}"
      changed_when: false
      failed_when: false
  when: vu_sshd_unit_exists | default(false)
