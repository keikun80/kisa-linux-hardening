# =============================================================================
# 글로벌 기본값 — KISA 취약점 강화 (U-01 ~ U-67)
# -----------------------------------------------------------------------------
# - 모든 변수는 group_vars(배포 프로필) 또는 실행 시 -e 로 덮어쓸 수 있다.
# - '고위험' 섹션의 토글은 기본 OFF이며, 활성화 시 반드시 백업/테스토론 먼저.
# - 배포별 패키지/서비스 명칭 차이는 group_vars/<그룹>/main.yml 에서 정의
#   (vu_*_pkgs, vu_chrony_unit, vu_autopatch 등).
# =============================================================================

# --- 백업 -------------------------------------------------------------------
# 설정 파일을 갱신하기 전, 원본 파일이 보존되는 곳 (모듈 backup 옵션과 연결)
vu_backups_root: /opt/backups/kisa_hardening

# --- 1장 계정 관리 ----------------------------------------------------------
# U-11: 로그인 셸이 남아있는 시스템 계정으로 돌려받을 대상.
#        실제로 사용하고 있는 계정은 이 목록에서 제외할 것.
vu_system_accounts:
  - daemon
  - bin
  - sys
  - adm
  - lp
  - uucp
  - nuucp
  - gopher
  - operator
  - games
  - cnr
  - man
  - nobody

# U-12: 유휴 셸 세션 타임아웃(초) — 가이드 600 이하 권장
vu_tmout_sec: 600
# U-30: 기본 UMASK — 가이드 022 이상 (여긴 더 엄격한 027)
vu_umask: "027"
# U-02: 비밀번호 최대 유효기간(일) — /etc/login.defs PASS_MAX_DAYS
vu_pass_max_days: 90
# U-13: 신규 계정 해시 알고리즘(login.defs ENCRYPT_METHOD)
vu_encryption_method: SHA512
# U-02: 비밀번호 정책 (pwquality / pam_pwquality)
vu_pw_minlen: 12
vu_pw_ucredit: -1      # 대문자 요구 개수
vu_pw_lcredit: -1      # 소문자
vu_pw_dcredit: -1      # 숫자
# U-03: 연속 실패 횟수에 도달하면 잠금 / 잠금 지속 시간(초)
vu_login_maxfails: 5
vu_login_unlock_time: 900
# U-02/U-03 마스터 스위치: PAM 스택(faillock/pwquality) 조치 자동 적용 여부.
# distro 그룹별로 오버라이드되며, 여기서 false 로 선언하는 이유는 프로필 외부의
# 호스트라도 undefined-variable 오류 없이 안전하게 보고 모드로 동작하게 하기 때문.
vu_pam_strict_stack: false
# U-06/U-08: wheel(또는 vu_su_wheel_group) 그룹에 속할 계정 목록.
#     이 그룹에 들어간 계정이 sudo/su 명령을 쓸 수 있다(그룹 없음은 skip).
#     기본값: AL2023/Fedora=ec2-user, Ubuntu=ubuntu (group_vars 에서 교체 가능).
vu_wheel_users: []

# 고위험: U-05 root 외의 UID-0 계정에 대한 자동 격리(잠금 + 셸 제거). 기본은 보고만 함
vu_lock_extra_uid0: false
# U-04: /etc/passwd 에 해시를 남기고 있는 계정을 격리(해시 제거+잠금+강제변경) —
#        해당 계정은 보안 관점에서 인정할 수 없으므로 기본 ON
vu_quarantine_plain_hashes: true
# 고위험: U-10 중복 UID 계정의 재할당. 사용하려면 vu_apply_dup_uid=true 와 매핑이 모두 필요하다
vu_apply_dup_uid: false
vu_dup_uid_newvals: {}          # 예: {'기존아이디': 1501}
                                 # 주의: 이전 UID 번호로 남은 파일의 소유자는 바뀐다(chown 병행 요망)

# --- 2장 파일/디렉터리 관리 ---------------------------------------------------
# U-31: 홈 디렉터리 목표 모드 (타인 쓰기 비트가 있으면 이 값으로 조정)
vu_home_dir_max_mode: "755"
# U-14/U-24: .profile/.bashrc 계열의 목표 모드 (owner는 각각 root/사용자)
vu_rc_file_mode: "0644"
vu_home_rc_files: [".bashrc", ".profile", ".bash_profile"]
# U-15/U-23/U-25: 전체 디스크 스웨프라면 비용이 크므로, 아래 경로까지만 자동 탐색
vu_scan_roots: [/etc, /home, /opt, /srv, /var/spool, /usr/local]
# U-33: /etc 밑에서 무시할 닷(·)파일 화이트리스트
vu_known_hidden_under_etc: []
# U-23: 신뢰 SUID/SGID 바이너리 기본 목록 (basename 으로 비교. 추가 필요시 확장)
vu_trusted_suid_bins:
  - passwd
  - su
  - newgrp
  - chage
  - chfn
  - chsh
  - expiry
  - gpasswd
  - pkexec
  - polkit-agent-helper-1
  - mount
  - umount
  - uuidd
  - fusermount
  - fusermount3
  - sudo
  - crtk
  - crtk3
# 고위험: U-25 world-writable 비트 자동 제거 (기본은 보고만)
vu_strip_world_writable: false
# U-56/U-57: FTP 거부 목록에 추가할 계정 (기본값은 시스템 계정 목록이 포함됨)
vu_ftp_blocked_users: []

# --- 3장 서비스 관리 ----------------------------------------------------------
# MASTER 스위치: 불필요한 서비스 '패키지 자체 제거'.
# 기본 OFF 면 '중지 + mask(부팅 시 기동 차단)'까지만 수행하여 영향 범위를 축소.
vu_legacy_service_cleanup: false
# U-54: cleartext FTP 서비스 중단(mask) — 기본 ON (서비스 중단 수준의 조치)
vu_disable_plaintext_ftp: true
# U-35: /var/ftp/pub 디렉터리 물리적 삭제 (데이터 손실 가능, 기본 OFF)
vu_del_ftp_pub_dir: false
# U-42: rpcbind mask — 외부 NFS 마운트(client 측)를 사용하는 호스트라면 반드시 OFF
vu_mask_rpcbind: false
# U-28: 호스트 방화벽(firewalld/ufw) 활성화.
#       EC2에서는 보통 Security Group 이 담당하므로 기본 OFF.
#       ON 시 vu_firewall_allow_sources 가 비어 있으면 방화벽 단계를 "경고 후 스킵"
#       (허용 출처를 잘못 적어 접속이 끊기는 일을 막기 위해서)
vu_manage_host_firewall: false
vu_firewall_allow_sources: []    # 예: ['10.0.0.0/8', '203.0.113.10/32']
vu_firewall_tcp_ports: [22]
# U-40: /etc/exports 재생성 (외부 마운트가 끊길 수 있음 → 기본 OFF. 리스트를 넘겨받으면 적용)
vu_nfs_manage_exports: false
vu_nfs_exports_lines: []         # 예: ['/srv/share1  10.0.1.0/24(ro,no_root_squash)']
# U-60: 공용 커뮤니티 문자열 프로브 (보고만)
vu_snmp_community_probe: true

# --- 4~5장 패치/생애주기 -------------------------------------------------------
# U-64: 정기적 보안 자동 패치 (dnf-automatic / unattended-upgrades)
# group_vars/<그룹>/main.yml 에서 오버라이드됨
# Default는 RHEL 계열(AL2023, Fedora) — Ubuntu는 group_vars/ubuntu/에서 덮어씀
vu_autopatch:
  pkg: dnf-automatic
  timer_unit: dnf-automatic.timer
vu_autopatch_security: true
# U-62: 로그인 경보 메시지 (기관의 정식 문구를 채워넣어 사용할 것)
vu_motd_text: |
  ================================================================
  NOTICE - FOR AUTHORIZED PERSONNEL ONLY

  This system is operated under security protection regulations.
  Unauthorized access, use, or interference is prohibited and,
  violators may be punished according to law.

  If you observe abnormal activity, contact the security officer
  immediately. Responsible dept: ELLOTTE BO DEV
  ================================================================