# =============================================================================
# U-23 SUID/SGID bit 파일 감사 (root 소유 바이너리에 집중)
# 판단 기준: 신뢰 목록(vu_trusted_suid_bins, basename) 밖의 SUID/SGID
#            이 없어야 양호
# 자동 조치: 화이트리스트 밖 파일의 SUID/SGID 비트 자동 제거
# =============================================================================

# ---------- 전체 스캔 ----------------------------------------------------------
- name: "[U-23:scan] SUID/SGID 파일 수집"
  shell: >-
    find {{ vu_scan_roots | join(' ') }} -xdev -type f
    \( -perm -4000 -o -perm -2000 \) -user root -printf '%h/%f\n' 2>/dev/null
  register: u23_raw
  changed_when: false
  failed_when: false

- name: "[U-23] 화이트리스트 밖 대상 경로 추출"
  shell: |
    python3 -c "
    import json, os
    trusted = {{ vu_trusted_suid_bins | default([]) | to_json }}
    raw = '''{{ u23_raw.stdout_lines | default([]) | to_json }}'''.strip()
    if raw:
        paths = json.loads(raw)
    else:
        paths = []
    suspicious = []
    for p in paths:
        bn = os.path.basename(p)
        if bn not in trusted:
            suspicious.append(p)
    print(json.dumps(suspicious))
    "
  register: u23_suspicious_paths
  changed_when: false
  failed_when: false

# ---------- 화이트리스트 밖 SUID/SGID 비트 제거 ---------------------------------
- name: "[U-23] SUID/SGID 제거 대상 변수 설정"
  set_fact:
    u23_strip_targets: "{{ u23_suspicious_paths.stdout | from_json }}"
  when: u23_suspicious_paths.stdout is defined and u23_suspicious_paths.stdout | length > 0

- name: "[U-23] SUID/SGID 제거 대상 변수 초기화 (스캔 대상 없음)"
  set_fact:
    u23_strip_targets: []
  when: u23_suspicious_paths.stdout is not defined or u23_suspicious_paths.stdout | length == 0

- name: "[U-23] 화이트리스트 밖 SUID/SGID 비트 자동 제거"
  shell: "chmod a-s {{ item }}"
  loop: "{{ u23_strip_targets }}"
  when: u23_strip_targets | length > 0
  failed_when: false
  changed_when: true

# ---------- 리포트 --------------------------------------------------------------
- name: "[U-23] 제거 대상 리포트"
  debug:
    msg: >-
      SUID/SGID 제거 완료:
      {{ u23_strip_targets | default([]) | map('basename') | join(', ') | default('- 없음 (양호)') }}

# ---------- 검증 ----------------------------------------------------------------
- name: "[U-23:verify] SUID/SGID 제거 검증"
  shell: >-
    find {{ vu_scan_roots | join(' ') }} -xdev -type f
    \( -perm -4000 -o -perm -2000 \) -user root -printf '%h/%f\n' 2>/dev/null
  register: u23_verify_raw
  changed_when: false
  failed_when: false
  when: u23_strip_targets | length > 0

- name: "[U-23:verify] 검증 결과 리포트"
  debug:
    msg: >-
      SUID/SGID 검증 완료:
      {{ u23_verify_raw.stdout_lines | default([]) | map('basename') | list | difference(vu_trusted_suid_bins) | join(', ') | default('- 모두 제거됨 (양호)') }}
  when: u23_strip_targets | length > 0
