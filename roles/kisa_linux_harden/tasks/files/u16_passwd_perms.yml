# =============================================================================
# U-16 /etc/passwd 소유자(root) + 권한(644 이하)
# =============================================================================

- import_tasks: "../frags/file_perms.yml"
  vars:
    fp:
      label: "U-16"
      paths: ["/etc/passwd"]
      owner: root
      group: root
      mode: "0644"
      required: true
