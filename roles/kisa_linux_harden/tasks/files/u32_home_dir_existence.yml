# =============================================================================
# U-32 홈 디렉토리로 지정한 디렉터리 존재 보장
# 판단 기준: passwd 에 홈으로 적힌 경로가 실제 존재
# 자동 조치: 부재 시 생성(생성한 것뿐이니 위험 낮음) — /home 아래, 혹은 /root
# =============================================================================

- name: "[U-32] 부재 가정(home) 목록 산출"
  shell: |
    python3 -c "
    import json
    missing = []
    with open('/etc/passwd') as f:
        for line in f:
            line = line.strip()
            if not line:
                continue
            parts = line.split(':')
            if len(parts) >= 7:
                name, uid, home = parts[0], int(parts[2]), parts[5]
                if home.startswith('/home/') or home == '/home' or home.startswith('/root'):
                    missing.append({'user': name, 'path': home, 'uid': uid})
    print(json.dumps(missing))
    "
  register: u32_missing_raw
  changed_when: false
  failed_when: false

- name: "[U-32] home 경로 실존 확인 (stat)"
  stat:
    path: "{{ item.path }}"
  register: u32_stat
  loop: "{{ (u32_missing_raw.stdout if u32_missing_raw.stdout | length > 0 else '[]') | from_json }}"
  loop_control:
    label: "{{ item.user }}:{{ item.path }}"

- name: "[U-32] 부재 홈 디렉터리 생성"
  file:
    path: "{{ item.item.path }}"
    state: directory
    owner: "{{ item.item.uid }}"
    group: "{{ item.item.uid }}"
    mode: "0755"
  loop: "{{ u32_stat.results }}"
  loop_control:
    label: "{{ item.invocation.module_args.path }}"
  when: not item.stat.exists
