# =============================================================================
# U-24 사용자(홈) 환경변수 파일(.bashrc/.profile 등)
# 판단 기준: 소유자는 계정 본인, 타인 쓰기 권한 없음
# =============================================================================

- name: "[U-24] 대상 파일 조합 만들기 (home x rc-file)"
  shell: |
    python3 -c "
    import json
    pairs = []
    rc_files = ['.bashrc', '.profile', '.bash_profile']
    with open('/etc/passwd') as f:
        for line in f:
            if line.strip():
                continue
            parts = line.split(':')
            if len(parts) >= 7:
                name, uid, home = parts[0], int(parts[2]), parts[5]
                if home.startswith('/home/'):
                    for f in rc_files:
                        pairs.append({'path': home + '/' + f, 'uid': uid})
    print(json.dumps(pairs))
    "
  register: u24_pairs_raw
  changed_when: false
  failed_when: false

- name: "[U-24] RC 파일 stat"
  stat:
    path: "{{ item.path }}"
  register: u24_stat
  loop: "{{ (u24_pairs_raw.stdout if u24_pairs_raw.stdout | length > 0 else '[]') | from_json }}"
  loop_control:
    label: "{{ item.path }}"

- name: "[U-24] 소유자/권한 정규화 (존재 파일만)"
  file:
    path: "{{ item.item.path }}"
    owner: "{{ item.item.uid }}"
    group: "{{ item.item.uid }}"
    mode: "{{ vu_rc_file_mode | default('0644') }}"
  loop: "{{ u24_stat.results }}"
  loop_control:
    label: "{{ item.invocation.module_args.path }}"
  when: item.stat.exists
