# =============================================================================
# U-24 사용자(홈) 환경변수 파일(.bashrc/.profile 등)
# 판단 기준: 소유자는 계정 본인, 타인 쓰기 권한 없음
# =============================================================================

- name: "[U-24] 대상 파일 조합 만들기 (home x rc-file)"
  set_fact:
    u24_pairs: >-
      {% set nav = [] %}
      {% for u in vu_users %}
        {% if (u.home | string) is match('^/home/.*') %}
          {% for f in vu_home_rc_files | default(['.bashrc', '.profile', '.bash_profile']) %}
            {% set _ = nav.append({'path': u.home ~ '/' ~ f, 'uid': u.uid}) %}
          {% endfor %}
        {% endif %}
      {% endfor %}
      {{ nav }}

- name: "[U-24] RC 파일 stat"
  stat:
    path: "{{ item.path }}"
  register: u24_stat
  loop: "{{ u24_pairs }}"
  loop_control:
    label: "{{ item.path }}"

- name: "[U-24] 소유자/권한 정규화 (존재 파일만)"
  file:
    path: "{{ item.item.path }}"
    owner: "{{ item.item.uid }}"
    group: "{{ item.item.uid }}"
    mode: "{{ vu_rc_file_mode | default('0644') }}"
  loop: "{{ u24_stat.results }}"
  loop_control:
    label: "{{ item.invocation.module_args.path }}"
  when: item.stat.exists
