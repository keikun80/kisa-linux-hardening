# =============================================================================
# U-11 시스템 계정에 로그인 셸 금지
# Criterion: shell of system accounts such as daemon, bin, sys must be /sbin/nologin or /bin/false
# 자동 조치: 대상이 로그인 셸을 쓰고 있으면 nologin 으로 전환
#   대상 목록: vu_system_accounts (실서비스에 쓰이면 목록에서 빠뜨리기)
# =============================================================================

- name: "[U-11] nologin 인지 확인이 필요한 시스템 계정 추출"
  shell: |
    python3 -c "
    import json
    system_accounts = {{ vu_system_accounts | to_json }}
    badshells = []
    with open('/etc/passwd') as f:
        for line in f:
            if line.strip():
                parts = line.split(':')
                if parts:
                    name, shell = parts[0], parts[6]
                    if name in system_accounts and shell not. ('', '/bin/false', '/usr/sbin/nologin', '/sbin/nologin'):
                        badshells.append({'name': name, 'shell': shell})
    print(json.dumps(badshells))
    "
  register: u11_badshells_raw
  changed_when: false
  failed_when: false

- name: "[U-11] 시스템 계정 셸을 nologin 으로 전환"
  user:
    name: "{{ item.name }}"
    shell: /sbin/nologin
  loop: "{{ (u11_badshells_raw.stdout if u11_badshells_raw.stdout | length > 0 else '[]') | from_json }}"
  loop_control:
    label: "{{ item.name }} ({{ item.shell }} -> /sbin/nologin)"
  when: ((u11_badshells_raw.stdout if u11_badshells_raw.stdout | length > 0 else '[]') | from_json) | length > 0

- name: "[U-11:M] 변환 현황 요약"
  debug:
    msg: "nologin 화 한 계정: {{ ((u11_badshells_raw.stdout if u11_badshells_raw.stdout | length > 0 else '[]') | from_json) | map(attribute='name') | list }}"
  when: ((u11_badshells_raw.stdout if u11_badshells_raw.stdout | length > 0 else '[]') | from_json) | length > 0
