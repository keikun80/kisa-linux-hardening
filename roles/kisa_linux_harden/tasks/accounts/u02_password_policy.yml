# =============================================================================
# U-02 비밀번호 관리정책 설정 (복잡성 정책)
# 판단 기준: pwquality(minlen>=8, 음수 credit 2종 이상) 또는
#            Ubuntu 는 common-password 의 pam_pwquality.so
# 자동 조치: vu_pam_strict_stack=true (RHEL 계열 기본 ON, Ubuntu 기본 OFF)
#            일 때만 PAM/설정을 직접 건드리며 나머지는 진단(수동 지침)으로 둔다.
# =============================================================================

- name: "[U-02] 비밀번호 품질 패키지 설치"
  package:
    name: "{{ 'libpwqual' if ansible_pkg_mgr in ['yum','dnf'] else 'libpam-pwquality' }}"
    state: present
  when: vu_pam_strict_stack | bool

# ---------- RHEL 계열 (AL2023/Fedora): pam_pwquality.so 모듈 주입 ----------
- name: "[U-02] pam_pwquality.so enforce_for_root 삽입 (RHEL 계열)"
  lineinfile:
    path: "{{ item }}"
    insertbefore: "^password.*pam_unix"
    regexp: "\\bpam_pwquality\\.so"
    line: "password requisite pam_pwquality.so enforce_for_root retry=3"
  loop:
    - /etc/pam.d/system-auth
    - /etc/pam.d/password-auth
  loop_control:
    label: "{{ item }}"
  when:
    - vu_pam_strict_stack | bool
    - ansible_pkg_mgr in ['yum', 'dnf']
    - file_stat(item).stat.exists | default(false)

# ---------- RHEL 계열 (AL2023/Fedora): /etc/security/pwquality.conf -----------
- name: "[U-02] pwquality.conf 정책 상향 (RHEL 계열)"
  lineinfile:
    path: /etc/security/pwquality.conf
    regexp: "^#?\\s*{{ item.k }}\\s*=?"
    line: "{{ item.k }}={{ item.v }}"
  loop:
    - { k: minlen,  v: "{{ vu_pw_minlen }}" }
    - { k: ucredit, v: "{{ vu_pw_ucredit }}" }
    - { k: lcredit, v: "{{ vu_pw_lcredit }}" }
    - { k: dcredit, v: "{{ vu_pw_dcredit }}" }
  loop_control:
    label: "{{ item.k }}={{ item.v }}"
  when:
    - vu_pam_strict_stack | bool
    - ansible_pkg_mgr in ['yum', 'dnf']

# ---------- Debian 계열 (Ubuntu): pam.d/common-password ----------------------
- name: "[U-02] common-password 맨 앞에 pam_pwquality 삽입 (Debian 계열)"
  lineinfile:
    path: /etc/pam.d/common-password
    insertbefore: "^password"
    regexp: "\\bpam_pwquality\\.so"
    line: >-
      password required pam_pwquality.so enforce_for_root retry=3
      minlen={{ vu_pw_minlen }} ucredit={{ vu_pw_ucredit }}
      lcredit={{ vu_pw_lcredit }} dcredit={{ vu_pw_dcredit }}
  when:
    - vu_pam_strict_stack | bool
    - ansible_pkg_mgr not in ['yum', 'dnf']

# ---------- 공통: login.defs PASS_MAX_DAYS (배포판 무관, 무조건 적용) -----------
- name: "[U-02] login.defs PASS_MAX_DAYS 고정 (비밀번호 최대 유효기간)"
  lineinfile:
    path: /etc/login.defs
    regexp: "^#?\s*PASS_MAX_DAYS\s+"
    line: "PASS_MAX_DAYS {{ vu_pass_max_days }}"
    create: true
    owner: root
    group: root
    mode: "0644"

# ---------- 공통: strict OFF 일때 사람 눈으로 확인하는 지침 --------------------
- name: "[U-02:M] 복잡성 정책 현재값 진단 (strict OFF)"
  debug:
    msg: |
      자동 적용 꺼져 있음. 수동 확인:
        RHEL 계열 : grep -Ev '#|(^$)' /etc/security/pwquality.conf
        Debian    : grep pam_pwquality /etc/pam.d/common-password
      통과 기준 : minlen>=8 + credit(u/l/d/ocredit) 음수값 2가지 이상
  when: not (vu_pam_strict_stack | bool)
