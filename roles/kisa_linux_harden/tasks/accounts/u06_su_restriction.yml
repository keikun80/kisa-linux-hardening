# =============================================================================
# U-06 사용자 계정 su 기능 제한
# 판단 기준: pam_wheel(use_uid) 또는 su 실행부가 관리그룹 전용(4750)
# Automatic action: apply only when vu_pam_strict_stack=true (modify /etc/pam.d/su and su bit)
#   그룹: RHEL 계열=wheel / Debian 계열=sudo (vu_su_wheel_group 프로필 변수)
# =============================================================================

- name: "[U-06] /etc/pam.d/su 파일 상태 확인"
  stat:
    path: /etc/pam.d/su
  register: u06_pam_su_stat

- name: "[U-06] /etc/sudoers.d 디렉터리 상태 확인"
  stat:
    path: /etc/sudoers.d
  register: u06_sudoers_d_stat

# ---------- su: pam_wheel 로 관리그룹만 가능하게 (trust 제거) -------------------
- name: "[U-06] pam.d/su 에서 trust 옵션 제거"
  replace:
    path: /etc/pam.d/su
    regexp: '(^\s*auth\s+required\s+pam_wheel\.so\b.*?)(\s+trust\b)(.*)'
    replace: "\\1\\3"
  when:
    - vu_pam_strict_stack | bool
    - u06_pam_su_stat.stat.exists

- name: "[U-06] pam_wheel 로 su 접근을 관리그룹만 가능하게"
  lineinfile:
    path: /etc/pam.d/su
    insertbefore: "^auth"
    regexp: "\\bpam_wheel\\.so"
    line: "auth required pam_wheel.so use_uid group={{ vu_su_wheel_group | default('wheel') }}"
  when:
    - vu_pam_strict_stack | bool
    - vu_su_wheel_group is defined
    - u06_pam_su_stat.stat.exists

# ---------- su: 바이너리 권한 고정 (RHEL 계열) --------------------------------
- name: "[U-06] su 바이너리 상태 확인"
  stat:
    path: "{{ item }}"
  loop:
    - /usr/bin/su
    - /bin/su
  register: u06_su_bin_stat
  when:
    - vu_pam_strict_stack | bool
    - ansible_pkg_mgr in ['yum', 'dnf']

- name: "[U-06] su 바이너리를 관리그룹 SUID 전용(4750) 고정 (RHEL 계열)"
  file:
    path: "{{ item.stat.path }}"
    owner: root
    group: "{{ vu_su_wheel_group | default('wheel') }}"
    mode: "04750"
  loop: "{{ u06_su_bin_stat.results | default([]) }}"
  when:
    - vu_pam_strict_stack | bool
    - ansible_pkg_mgr in ['yum', 'dnf']
    - item.stat is defined and item.stat.exists

# ---------- sudo: /etc/sudoers.d drop-in (관리그룹만 sudo 허용) ----------------
- name: "[U-06] sudoers drop-in 으로 sudo 를 관리그룹 전용으로 제한"
  copy:
    dest: /etc/sudoers.d/99-kisa-wheel-sudo
    content: "%{{ vu_su_wheel_group | default('wheel') }} ALL=(ALL) ALL\n"
    owner: root
    group: root
    mode: "0440"
  when:
    - vu_su_wheel_group is defined
    - u06_sudoers_d_stat.stat.exists and u06_sudoers_d_stat.stat.isdir

# ---------- wheel/sudo 그룹 멤버십: vu_wheel_users ----------------------------
- name: "[U-06] vu_wheel_users 에 명시한 계정을 관리그룹에 추가"
  user:
    name: "{{ item }}"
    groups: "{{ vu_su_wheel_group | default('wheel') }}"
    append: true
  loop: "{{ vu_wheel_users | default([]) }}"
  when: vu_su_wheel_group is defined

# ---------- 공통: strict OFF 일때 수동 지침 ------------------------------------
- name: "[U-06:M] Diagnosing su restriction state(strict OFF or wheel absent)"
  debug:
    msg: |
      자동 적용 꺼졌거나 wheel/sudo 그룹 미확인. 수동 확인:
        grep 'pam_wheel' /etc/pam.d/su
        ls -l /usr/bin/su
      통과 기준: pam_wheel(use_uid) 주석 해제  또는  su = 4750 root:관리그룹
  when:
    - not (vu_pam_strict_stack | bool)
