# =============================================================================
# U-09 존재하지 않는 계정이 포함된 GID(그룹 멤버) 금지
# 판단 기준: /etc/group 의 멤버 필드에 passwd 에 없는 아이디가 없어야 함
# 조치: ghost 멤버의 이름을 뽑아 리포트; 자동 편집은 파일 충돌 위험이 있어
#       그룹명/멤버 수치를 바탕으로 사람이 처분한다 (visudo/grpck -y 유사 패턴)
# =============================================================================

- name: "[U-09] 존재하지 않는 그룹 멤버 추출"
  shell: |
    python3 -c "
    import json
    passwd_users = set()
    with open('/etc/passwd') as f:
        for line in f:
            if line.strip():
                parts = line.split(':')
                if parts:
                    passwd_users.add(parts[0])

    ghosts = []
    with open('/etc/group') as f:
        for line in f:
            if ':' not in line:
                continue
            parts = line.split(':')
            if len(parts) > 3 and parts[3]:
                for member in parts[3].split(','):
                    if member and member not in passwd_users:
                        ghosts.append(parts[0] + ' <- ' + member)
    print(json.dumps(ghosts))
    "
  register: u09_ghosts_raw
  changed_when: false
  failed_when: false

- name: "[U-09:M] Ghost member report(remove determined by person)"
  debug:
    msg: >-
      {{ '존재하지 않는 멤버 발견: ' ~ ((u09_ghosts_raw.stdout | from_json | default([])) | join(' ; '))
         if (u09_ghosts_raw.stdout | from_json | default([])) | length > 0
         else 'ghost 멤버 없음 (양호)' }}
      처분 예: gpasswd -d <member> <group>
