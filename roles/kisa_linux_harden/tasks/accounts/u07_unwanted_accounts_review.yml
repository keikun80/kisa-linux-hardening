# =============================================================================
# U-07 불필요한 계정 제거  ← 사람의 업무 영역 (자동 삭제로 돌리지 않음)
# 판단 기준: 미사용/퇴사자 계정이 로그인 가능 셸을 갖고 있지 않아야 양호
# 여기서는 '로그인 가능한 계정 인벤토리'를 뽑아서 리뷰 자료로 제공한다.
# =============================================================================

- name: "[U-07:M] 로그인 가능한 계정은 누구인가 (리뷰 목록)"
  debug:
    msg: >-
      셸이 실행형(/bin/sh 계열)인 계정 — 퇴사자/불필요 계정이 섞였는지 사람이 확인:
      {{ vu_users | selectattr('shell', 'search', '(sh|bash|zsh|ksh|csh)$') | map(attribute='name') | list }}
      [참고: 검토 후 user: name=x state=absent 또는 shell nologin 으로 폐기]

- name: "[U-07:M] 수동 점검 명령어 안내"
  debug:
    msg: |
      grep -Ev 'nologin|/bin/false' /etc/passwd
      lastlog            # 마지막 로그인 기록으로 장기 미사용 계정 추적
        passwd -S          # 잠금 상태 요약
