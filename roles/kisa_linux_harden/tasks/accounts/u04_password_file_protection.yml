# =============================================================================
# U-04 비밀번호 파일 보호 (shadow 사용 의무화)
# 판단 기준: /etc/shadow 존재, /etc/passwd 2번째 필드가 전부 'x'
# 자동 조치: 평문/해시가 passwd 안에 남은 계정은 격리(해시 제거 + 잠금 +
#            초기화 강제 플래그) — 잠금 풀어도 빈 비밀번호로 못 들고감
# =============================================================================

- name: "[U-04] /etc/shadow 존재 필수 체크"
  stat:
    path: /etc/shadow
  register: u04_shadow

- name: "[U-04] /etc/shadow 부재 시 실패 선언"
  assert:
    that: u04_shadow.stat.exists
    fail_msg: "/etc/shadow 가 없습니다 — shadow password 미구성 상태(취약). 수동 복구 필요"

- name: "[U-04] passwd 내 해시 잔존 계정 추출 (전체)"
  shell: |
    while IFS=: read -r name pass _rest; do
      [ -z "$name" ] && continue
      [ -z "$pass" ] && continue
      case "$pass" in x|!*) continue ;; esac
      case "$pass" in \*) continue ;; esac
      echo "$name"
    done < /etc/passwd
  register: u04_all_leakers
  changed_when: false
  failed_when: false

- name: "[U-04] passwd 내 해시 잔존 계정 추출 (UID>=1000)"
  shell: |
    while IFS=: read -r name pass uid _rest; do
      [ -z "$name" ] && continue
      [ -z "$pass" ] && continue
      [ "$uid" -lt 1000 ] 2>/dev/null && continue
      case "$pass" in x|!*) continue ;; esac
      case "$pass" in \*) continue ;; esac
      echo "$name"
    done < /etc/passwd
  register: u04_general_leakers
  changed_when: false
  failed_when: false

- name: "[U-04] 일반 계정(uid>=1000) 평문 해시 격리"
  shell: "passwd -d -l {{ item }} && chage -d 0 {{ item }}"
  loop: "{{ u04_general_leakers.stdout_lines | default([]) }}"
  loop_control:
    label: "{{ item }}"
  changed_when: true
  failed_when: false
  when: vu_quarantine_plain_hashes | default(true) | bool

- name: "[U-04:M] 격리 대상 계정 요약"
  debug:
    msg: "passwd 에 해시를 남기고 있는 계정: {{ u04_all_leakers.stdout_lines | default([]) }}"
  when: not (vu_quarantine_plain_hashes | default(true) | bool)
