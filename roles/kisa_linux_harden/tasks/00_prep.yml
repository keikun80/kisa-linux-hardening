# =============================================================================
# [PREP] 전처리 — 권한·팩트 수집·백업 루트·고위험 토글 알림
# =============================================================================
---
# 각 대상 호스트의 SSH Host Key를 컨트롤 노드의 known_hosts에 등록
- name: Scan and add SSH host keys to localhost known_hosts
  ansible.builtin.known_hosts:
    name: "{{ item.name }}"
    key: "{{ lookup('pipe', 'ssh-keyscan -T 5 -t ed25519,ecdsa,rsa -H ' + item.target) }}"
    path: "{{ ansible_env.HOME }}/.ssh/known_hosts"
    state: present
  loop:
    - name: "{{ ansible_host | default(inventory_hostname) }}"
      target: "{{ ansible_host | default(inventory_hostname) }}"
    - name: "{{ inventory_hostname }}"
      target: "{{ inventory_hostname }}"
  delegate_to: localhost
  connection: local
  run_once: false
  when: item.target is defined and item.target | length > 0

# 환경의 gathered_subset=minimal 류 트리밍(기업 템플릿/환경변수)을 받지 않기 위해,
# 핵심 팩트가 빠져 있으면 여기서 전체 수집(setup filter=*)을 한 번 더 강제한다.
- name: "[PREP] 팩트 수집 보정 (축소된 gathered_subset 대응)"
  setup:
    filter: "*"
  when: ansible_effective_user is not defined
  tags: [always]

# 실효 사용자는 "팩트 수집 시점"이 아닌 "태스크 실행 시점"을 믿는다 —
# become 적용 여부는 이 순간의 셸만 정확히 알고 있기 때문(캐시/트리밍/승급 시점 차이 무관).
- name: "[PREP] 실행 시점 실효 사용자 실측 (become 반영)"
  command: id -un
  register: vu_prep_uid
  changed_when: false
  tags: [always]

- name: "[PREP] 루트 권한 사전조건 확인"
  assert:
    that: (vu_prep_uid.stdout | default('') | trim) == 'root'
    fail_msg: >-
      실효 사용자가 '{{ vu_prep_uid.stdout | default("<측정 불가>") | trim }}' 인데 root 가 필요합니다.
      실행 컨텍스트(플레이/호스트 인벤토리/환경)에 become: true 가 실제로 전달되는지 확인하시고,
      필요시 --become 또는 --ask-become-pass 로 재실행하십시오.
  tags: [always]

# vu_users: JSON 배열로 파싱 — set_fact + Jinja2 >- 는 항상 str 이 되므로 shell + from_json 사용
- name: "[PREP] 사용자 데이터베이스 로드 (/etc/passwd 파싱 → JSON)"
  shell: |
    python3 -c "
    import json, sys
    users = []
    with open('/etc/passwd') as f:
        for line in f:
            line = line.strip()
            if not line:
                continue
            parts = line.split(':')
            if len(parts) >= 7:
                users.append({
                    'name': parts[0],
                    'uid': int(parts[2]),
                    'home': parts[5],
                    'shell': parts[6]
                })
    print(json.dumps(users))
    "
  register: vu_users_raw
  changed_when: false
  failed_when: false
  tags: [always]

- name: "[PREP] vu_users 팩트 등록 (JSON → dict)"
  set_fact:
    vu_users: "{{ vu_users_raw.stdout | from_json }}"
  tags: [always]

# vu_md5_users: 약한 해시(MD5) 사용 계정
- name: "[PREP] 약한 해시(MD5) 사용 중인 계정 프로빙 (U-13 참조)"
  shell: |
    python3 -c "
    import json, sys
    names = []
    try:
        with open('/etc/shadow') as f:
            for line in f:
                line = line.strip()
                if not line:
                    continue
                parts = line.split(':')
                if len(parts) > 1 and parts[1].startswith('\$1\$'):
                    names.append(parts[0])
    except PermissionError:
        pass
    print(json.dumps(names))
    "
  register: vu_md5_raw
  changed_when: false
  failed_when: false
  tags: [always]

- name: "[PREP] vu_md5_users 팩트 등록"
  set_fact:
    vu_md5_users: "{{ vu_md5_raw.stdout | from_json }}"
  tags: [always]

# vu_wheel_gid: wheel 그룹 GID (없으면 null)
- name: "[PREP] wheel GID 조회 (U-06 su 제한)"
  shell: |
    python3 -c "
    import json
    gid = None
    try:
        with open('/etc/group') as f:
            for line in f:
                if line.startswith('wheel:'):
                    parts = line.split(':')
                    gid = int(parts[2])
    except (FileNotFoundError, PermissionError):
        pass
    print(json.dumps(gid))
    "
  register: vu_wheel_gid_raw
  changed_when: false
  failed_when: false
  tags: [always]

- name: "[PREP] vu_wheel_gid 팩트 등록"
  set_fact:
    vu_wheel_gid: "{{ vu_wheel_gid_raw.stdout | from_json }}"
  tags: [always]

- name: "[PREP] 백업 루트 디렉터리 확보"
  file:
    path: "{{ vu_backups_root }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  tags: [always]

- name: "[PREP] sshd 유닛 존재 여부 확인"
  stat:
    path: "{{ item }}"
  register: vu_sshd_stat
  loop:
    - /etc/systemd/system/sshd.service
    - /usr/lib/systemd/system/sshd.service
    - /lib/systemd/system/sshd.service
  tags: [always]

- name: "[PREP] vu_sshd_unit_exists 팩트 계산"
  set_fact:
    vu_sshd_unit_exists: "{{ vu_sshd_stat.results | selectattr('stat.exists') | list | length > 0 }}"
  tags: [always]

- name: "[PREP] 활성 고위험 토글 집계"
  shell: |
    python3 -c "
    import json, os
    toggles = [
        ('vu_pam_strict_stack', 'PAM 스택 직접 조작(U-02/U-03)'),
        ('vu_manage_host_firewall', '호스트 방화벽 활성화(U-28)'),
        ('vu_legacy_service_cleanup', '레거시 패키지 제거(U-36등)'),
        ('vu_mask_rpcbind', 'rpcbind 봉쇄(U-42)'),
        ('vu_lock_extra_uid0', 'UID-0 여분 계정 격리(U-05)'),
        ('vu_apply_dup_uid', '중복 UID 재할당(U-10)'),
        ('vu_strip_world_writable', 'ww-bit 자동 제거(U-25)'),
        ('vu_del_ftp_pub_dir', '/var/ftp/pub 삭제(U-35)'),
        ('vu_nfs_manage_exports', '/etc/exports 재생성(U-40)')
    ]
    # Ansible facts 파일을 읽는 대신, 빈 배열 반환 (vars 접근 불가)
    print(json.dumps([]))
    "
  register: vu_enabled_high_risk_raw
  changed_when: false
  failed_when: false
  tags: [always]

- name: "[PREP] vu_enabled_high_risk 팩트 등록 (vars 기반 필터)"
  set_fact:
    vu_enabled_high_risk: "{{ _high_risk }}"
  vars:
    _high_risk: >-
      {{
          [('PAM 스택 직접 조작(U-02/U-03)', vu_pam_strict_stack),
           ('호스트 방화벽 활성화(U-28)', vu_manage_host_firewall),
           ('레거시 패키지 제거(U-36등)', vu_legacy_service_cleanup),
           ('rpcbind 봉쇄(U-42)', vu_mask_rpcbind),
           ('UID-0 여분 계정 격리(U-05)', vu_lock_extra_uid0),
           ('중복 UID 재할당(U-10)', vu_apply_dup_uid),
           ('ww-bit 자동 제거(U-25)', vu_strip_world_writable),
           ('/var/ftp/pub 삭제(U-35)', vu_del_ftp_pub_dir),
           ('/etc/exports 재생성(U-40)', vu_nfs_manage_exports)]
          | selectattr('1')
          | map(attribute='0')
          | list }}
  tags: [always]

- name: "[PREP] 고위험 토글 알림"
  debug:
    msg: >-
      !!! HIGH-RISK TOGGLE ENABLED — 백업/스테이징 완료가 필요합니다:
      {{ vu_enabled_high_risk | join(', ') }}
  when: vu_enabled_high_risk | length > 0
  tags: [always]
