# =============================================================================
# KISA 취약점 강화 (U-01 ~ U-67) — ID별 import 오케스트레이터
#
# 실행 예:
#   ansible-playbook -i inventory/ec2.ini plays/site.yml --check        # 전수 감사(dry-run)
#   ansible-playbook -i inventory/ec2.ini plays/site.yml -t u-01        # 단일 ID 실행
#   ansible-playbook ... -t u-01 -t u-02 ...                            # 일부 ID
#   ansible-playbook ... -t cat.accounts                                # 카테고리 단위
#
# 태그 규칙: 각 import 에 [u-XX, cat.<카테고리>] 를 부착.
# 태스크명 규약: 강제 태스크는 "[U-XX] ...", 진단/안내만 하는 태스크는 "[U-XX:M] ..."
# (audit 리포트에서 :M 는 "기계 판정 불가·사람 확인 항목"으로 분류된다)
# =============================================================================

