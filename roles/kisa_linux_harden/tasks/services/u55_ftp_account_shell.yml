# =============================================================================
# U-55 FTP 전용 계정 셸 제한 (nologin)
# =============================================================================

- name: "[U-55] 셸이 열린 FTP 계정을 추출 (ftp/anon 계열 이름만 취급)"
  set_fact:
    u55_targets: >-
      {{ vu_users
         | selectattr('name', 'search', '^(ftp|anon)')
         | rejectattr('shell', 'in', ['', '/bin/false', '/usr/sbin/nologin', '/sbin/nologin'])
         | list }}

- name: "[U-55] FTP 계정 셸을 nologin 으로 전환"
  user:
    name: "{{ item.name }}"
    shell: /sbin/nologin
  loop: "{{ u55_targets }}"
  loop_control:
    label: "{{ item.name }}"
  when: u55_targets | length > 0

- name: "[U-55:M] FTP 계정 셸 상태 리포트"
  set_fact:
    u55_report: >-
      {% set nav = [] %}
      {% for u in vu_users %}
        {% if u.name is match('^(ftp|anon)') %}
          {% set _ = nav.append(u.name ~ '(' ~ u.shell ~ ')') %}
        {% endif %}
      {% endfor %}
      {{ nav }}

- name: "[U-55:M] FTP 계정 셸 리포트"
  debug:
    msg: "FTP 계류 계정: {{ u55_report | join('  ') if u55_report else '- 없음 (양호)' }}"
