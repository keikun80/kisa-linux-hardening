# =============================================================================
# U-55 FTP 전용 계정 셸 제한 (nologin)
# =============================================================================

- name: "[U-55] 셸이 열린 FTP 계정을 추출 (ftp/anon 계열 이름만 취급)"
  shell: |
    python3 -c "
    import json
    targets = []
    with open('/etc/passwd') as f:
        for line in f:
            line = line.strip()
            if not line:
                continue
            parts = line.split(':')
            if len(parts) >= 7:
                name, shell = parts[0], parts[6]
                if name.startswith('ftp') or name.startswith('anon'):
                    if shell not in ('', '/bin/false', '/usr/sbin/nologin', '/sbin/nologin'):
                        targets.append(name)
    print(json.dumps(targets))
    "
  register: u55_targets_raw
  changed_when: false
  failed_when: false

- name: "[U-55] FTP 계정 셸을 nologin 으로 전환"
  user:
    name: "{{ item }}"
    shell: /sbin/nologin
  loop: "{{ (u55_targets_raw.stdout if u55_targets_raw.stdout | length > 0 else '[]') | from_json }}"
  loop_control:
    label: "{{ item }}"
  when: ((u55_targets_raw.stdout if u55_targets_raw.stdout | length > 0 else '[]') | from_json) | length > 0

- name: "[U-55:M] FTP 계정 셸 상태 리포트"
  debug:
    msg: >-
      FTP 계정 셸:
      {{ (lookup('pipe', "grep '^ftp:\\|^anon:' /etc/passwd | cut -d: -f1,7 || echo 없음") | default('-')) }}
