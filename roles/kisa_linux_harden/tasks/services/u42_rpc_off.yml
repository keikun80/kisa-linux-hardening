# =============================================================================
# U-42 불필요한 RPC(rpcbind) 서비스 비활성화
# ※ NFS 클라이언트 마운트 감지 시 import 레벨에서 스킵되므로
#   이 파일에 도달하는 것은 NFS 미사용 환경임.
#   그 외에는 vu_mask_rpcbind 토클로 제어.
# =============================================================================

- import_tasks: "../frags/unit_off.yml"
  when: vu_mask_rpcbind | bool
  vars:
    fu:
      label: "U-42"
      units: [rpcbind]

- name: "[U-42:M] rpcbind 상태 진단 (토클 OFF 일 때)"
  shell: "systemctl is-active rpcbind 2>/dev/null || echo unknown"
  register: u42_state
  changed_when: false
  failed_when: false

- name: "[U-42:M] rpcbind 리포트"
  debug:
    msg: >-
      rpcbind 상태: {{ u42_state.stdout | default('unknown') | trim }}
      {{ 'active 이면 NFS/NIS 의 의존 여부를 확인 후 -e vu_mask_rpcbind=true 로 차단 진행'
         if 'active' in (u42_state.stdout | default(''))
         else '미작동(양호)' }}
