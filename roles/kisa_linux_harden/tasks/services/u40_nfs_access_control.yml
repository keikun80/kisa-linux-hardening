# =============================================================================
# U-40 NFS 접근 통제 (/etc/exports)
# 판단 기준: 전체 허용(*) 없고 특정 네트워크만 지정
# 자동 조치:
#   - '*' 공유가 있으면 리포트(경고)
#   - vu_nfs_manage_exports=true + vu_nfs_exports_lines 제공 시
#     exports 를 manifest 대로 재생성 (외부 마운트가 끊킬 수 있음)
# =============================================================================

- name: "[U-40:scan] exports 파일 상태 + '*' 공유 탐색"
  shell: >-
    sh -c "test -f /etc/exports || echo NOFILE;
    grep -Env '^[[:space:]]*#' /etc/exports 2>/dev/null
    | grep -E '[[:space:])(]\\*[[:space:],)(]' || true"
  register: u40_out
  changed_when: false
  failed_when: false

- name: "[U-40:M] 전체 허용(*) 공유 리포트"
  debug:
    msg: >-
      {{ 'NOFILE' in (u40_out.stdout | default('NOFILE'))
         and 'exports 파일 없음 — NFS server 가 없을 가능성이 높아 양호.'
         or ('*' in (u40_out.stdout | default('')))
         and ('찾은 전체 허용 공유: ' ~ u40_out.stdout_lines | default([]) | join('; ') ~ ' — vu_nfs_exports_lines 로 대체 권장')
         or 'wildcard(overall) 공유 없음 (양호)' }}
      ※ 정책 변경 후에는 exports -u (또는 systemctl reload nfs) 로 재적용

- name: "[U-40] manifest 로 exports 재구성 (토클 ON)"
  copy:
    dest: /etc/exports
    owner: root
    group: root
    mode: "0640"
    content: |
      # KISA U-40 - NFS share manifest 관리됨
      {{ vu_nfs_exports_lines | join('\n') }}
  when:
    - vu_nfs_manage_exports | bool
    - vu_nfs_exports_lines | length > 0
