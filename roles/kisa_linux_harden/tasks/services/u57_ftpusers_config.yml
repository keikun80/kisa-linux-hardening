# =============================================================================
# U-57 ftpusers 파일 구성 (root 포함 거부 목록 존재)
# 판단 기준: /etc/ftpusers 가 있고, root 이 목록에 존재
# =============================================================================

- name: "[U-57] vsftpd 설정 파일 존재 확인"
  stat:
    path: "{{ item }}"
  loop:
    - /etc/vsftpd/vsftpd.conf
    - /etc/vsftpd.conf
  register: u57_vsftpd_conf_stat

- name: "[U-57] 존재하는 vsftpd 설정 파일 선택"
  set_fact:
    u57_vsftpd_conf_path: "{{ (u57_vsftpd_conf_stat.results | selectattr('stat.exists', 'defined') | selectattr('stat.exists') | map(attribute='stat.path') | list | first) | default('') }}"

- name: "[U-57] ftpusers 존재 + root 포함 보장"
  lineinfile:
    path: /etc/ftpusers
    line: root
    create: true
    owner: root
    group: root
    mode: "0644"
    regexp: "^root$"
  when: u57_vsftpd_conf_path != ''
  # vsftpd 가 있는 시스템에서만 ftpusers 가 의미가 있으므로 그 전제하에 처리

- name: "[U-57:M] FTP 스택 없음 리포트"
  debug:
    msg: "vsftpd/ftpusers 스택 없음 — 해당 없음 (양호)"
  when: u57_vsftpd_conf_path == ''
