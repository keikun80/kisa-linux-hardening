# =============================================================================
# U-57 ftpusers 파일 구성 (root 포함 거부 목록 존재)
# 판단 기준: /etc/ftpusers 가 있고, root 이 목록에 존재
# =============================================================================

- name: "[U-57] ftpusers 존재 + root 포함 보장"
  lineinfile:
    path: /etc/ftpusers
    line: root
    create: true
    owner: root
    group: root
    mode: "0644"
    regexp: "^root$"
  when: lookup('fileglob', '/etc/vsftpd/vsftpd.conf', errors='ignore') | length > 0
  # vsftpd 가 있는 시스템에서만 ftpusers 가 의미가 있으므로 그 전제하에 처리

- name: "[U-57:M] FTP 스택 없음 리포트"
  debug:
    msg: "vsftpd/ftpusers 스택 없음 — 해당 없음 (양호)"
  when: lookup('fileglob', '/etc/vsftpd/vsftpd.conf', errors='ignore') | length == 0
