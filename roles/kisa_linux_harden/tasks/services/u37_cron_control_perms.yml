# =============================================================================
# U-37 crontab 접근 제어 파일(cron.allow/deny) 권한
# 판단 기준: 640 이하 root
# =============================================================================

# ---------- cron/at 설정 파일 권한 640 ----------------------------------------
- import_tasks: "../frags/file_perms.yml"
  vars:
    fp:
      label: "U-37"
      paths: ["/etc/crontab", "/etc/cron.allow", "/etc/cron.deny", "/etc/at.allow", "/etc/at.deny"]
      owner: root
      group: root
      mode: "0640"
      required: false

# ---------- cron/at 바이너리 권한 640 ------------------------------------------
- name: "[U-37] cron/at 바이너리 권한 640으로 변경"
  file:
    path: "{{ item.path }}"
    owner: root
    group: root
    mode: "0640"
  loop:
    - /usr/bin/at
    - /usr/bin/atq
    - /usr/bin/atrm
    - /usr/bin/batch
    - /usr/bin/crontab
  failed_when: false
