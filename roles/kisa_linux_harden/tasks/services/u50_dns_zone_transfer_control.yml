# =============================================================================
# U-50 DNS Zone Transfer 제한 (allow-transfer)
# 판단 기준: none 또는 특정 슬레이브 IP 제한
# 자동 조치 없음 — 정책 변경은 사람의 몫
# =============================================================================

- name: "[U-50:scan] allow-transfer 선언 수집"
  shell: >-
    sh -c "grep -rEn 'allow[-_]transfer' /etc/named.conf /etc/named.conf.d/ /etc/bind/ 2>/dev/null | grep -v '^\s*#' || true"
  register: u50_tf
  changed_when: false
  failed_when: false

- name: "[U-50] 위험 선언(any/anywhere) 추출"
  set_fact:
    u50_risky: >-
      {{ u50_tf.stdout_lines | default([])
         | select('search', '=\\s*(any|anywhere)\\s*;') | list }}

- name: "[U-50:M] Zone-Transfers 상태 리포트"
  debug:
    msg: >-
      {{ '위험 선언 발췌 (사람 수정 필요, "none;" 또는 슬레이브 IP로 제한): '
         ~ (u50_risky | join(' ; ')) if u50_risky | length > 0
         else '위험한 allow-transfers 없음 — named 구동 시 기본값(None)이 아니라
              named.conf의 지역(zone) 단위가 사람 확인 대상. (named 미설치 = 양호)' }}
