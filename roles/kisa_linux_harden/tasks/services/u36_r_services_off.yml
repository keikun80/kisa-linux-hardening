# =============================================================================
# U-36 r 계열 서비스(rsh/rlogin/rexec) 비활성화
# =============================================================================

- import_tasks: "../frags/unit_off.yml"
  vars:
    fu:
      label: "U-36"
      units: [rsh, rlogin, rexec, rshd, rlogind, rexd]

- name: "[U-36] r-series 서비스 패키지 제거 (토클 ON)"
  package:
    name: "{{ item }}"
    state: absent
  loop: "{{ vu_legacysvc_pkgmap.rservices | default([]) }}"
  when: vu_legacy_service_cleanup | bool
  failed_when: false
