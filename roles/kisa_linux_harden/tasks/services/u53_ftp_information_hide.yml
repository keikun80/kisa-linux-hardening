# =============================================================================
# U-53 FTP 서비스 정보 노출 제한 (banner 미노출)
# vsftpd: pasv_announce? — banner 은 ftptd_banner="" 로 비공개
# =============================================================================

- name: "[U-53] vsftpd 설정 파일 존재 확인"
  stat:
    path: "{{ item }}"
  loop:
    - /etc/vsftpd/vsftpd.conf
    - /etc/vsftpd.conf
  register: u53_vsftpd_conf_stat

- name: "[U-53] 존재하는 vsftpd 설정 파일 선택"
  set_fact:
    u53_vsftpd_conf_path: "{{ (u53_vsftpd_conf_stat.results | selectattr('stat.exists', 'defined') | selectattr('stat.exists') | map(attribute='stat.path') | list | first) | default('') }}"

- name: "[U-53] VsFtpD 배너를 은닉 문자열로 교체 (버전 정보 노출 방지)"
  lineinfile:
    path: "{{ u53_vsftpd_conf_path }}"
    regexp: "^#?ftp_banner"
    line: "ftp_banner=Ready."
  when: u53_vsftpd_conf_path != ''

- name: "[U-53:M] FTP 서버 설정이 없으면 해당 없음"
  debug:
    msg: "VsFtpD 미설치(혹은 설정 파일 없음) — 배너 문제 해당 없음"
  when: u53_vsftpd_conf_path == ''
