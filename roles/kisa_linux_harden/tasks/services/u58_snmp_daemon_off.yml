# =============================================================================
# U-58 불필요한 SNMP 데몬 구동 점검
# =============================================================================

- import_tasks: "../frags/unit_off.yml"
  vars:
    fu:
      label: "U-58"
      units: [snmpd, snmptrapd, snmpd.socket]

- name: "[U-58] SNMP 패키지 제거 (토클 ON)"
  package:
    name: "{{ item }}"
    state: absent
  loop: "{{ vu_snmp_pkgs | default([]) }}"
  when: vu_legacy_service_cleanup | bool
  failed_when: false
